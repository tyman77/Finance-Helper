# Categorization rules + the category -> GL account map.
#
# Rules apply to LONG-layout sources (United, UPS, National): the first rule
# whose conditions all match a line's description wins. WIDE-layout sources
# (Hotel Engine) assign categories directly in sources.yml, so they skip rules.
#
# gl_account values are PLACEHOLDERS — replace with your real Sage Intacct
# chart-of-accounts numbers.

rules:
  # --- United (fees hidden in the passenger-name field) ---
  - source: united
    contains: "CHECKED BAG"
    category: travel_baggage
  - source: united
    contains: "PREFERRED ZONE"
    category: travel_seat_fees
  # --- UPS ---
  - source: ups
    contains: "fuel surcharge"
    category: shipping_fuel_surcharge
  - source: ups
    contains: "residential"
    category: shipping_residential_surcharge
  # --- generic ---
  - contains: "resort fee"
    category: travel_lodging_fees
  - contains: "parking"
    category: travel_parking
  - contains: "tax"
    category: taxes

# Category -> GL account. `default_category` (sources.yml) and wide-layout
# component categories resolve their account here.
categories:
  # Real GL accounts (from the Sage Intacct chart). Fee/tax components of a trip
  # ride along with the trip's primary travel account.
  travel_airfare:                 { gl_account: "52200" }   # COGS Travel: Flights / Parking
  travel_airfare_fees:            { gl_account: "52200" }
  travel_baggage:                 { gl_account: "52200" }
  travel_seat_fees:               { gl_account: "52200" }
  travel_parking:                 { gl_account: "52200" }
  travel_lodging:                 { gl_account: "52300" }   # COGS Travel: Hotel
  travel_lodging_taxes:           { gl_account: "52300" }
  travel_lodging_fees:            { gl_account: "52300" }
  travel_lodging_incidentals:     { gl_account: "52300" }
  travel_lodging_flex:            { gl_account: "52300" }
  travel_booking_fee:             { gl_account: "52300" }
  travel_credits:                 { gl_account: "52300" }
  travel_car_rental:              { gl_account: "52600" }   # COGS Travel: Rental Car / Uber
  shipping_freight:               { gl_account: "50200" }   # COGS Freight
  shipping_fuel_surcharge:        { gl_account: "50200" }
  shipping_residential_surcharge: { gl_account: "50200" }
  taxes:                          { gl_account: "52200" }
  uncategorized:                  { gl_account: "99500" }   # Ask My Accountant
