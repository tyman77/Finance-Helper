# Cash Proof (reconciliation) configuration — safe to commit: no data, just
# format mappings and matching parameters.

bank:
  # Deployment-specific words to strip from bank descriptions when deriving
  # the counterparty (the bank's own name shows up inside ACH descriptors).
  noise_words: [flatirons]

sage:
  # Column mapping for the Sage Intacct GL-detail export. Either a signed
  # `amount` column, or a `debit`/`credit` pair (debits to a cash account are
  # cash IN, credits are cash OUT — the loader signs them accordingly).
  columns:
    date: "Entry Date"
    description: "Memo/Description"
    amount: null
    debit: "Debit"
    credit: "Credit"
    account: "Account No"
    journal: "Journal"
    doc: "Document Number"
  # GL accounts that represent this bank account. Only rows hitting these
  # accounts participate in the tie-out. (From the real chart: 10700 is
  # Flatirons Bank checking; 10706 savings, 10707 sweep, 10709 CD exist for
  # when their exports join the proof. SAGE_CASH_ACCOUNTS env overrides.)
  cash_accounts: ["10700"]
  # Sibling and clearing accounts pulled alongside cash: Bill.com clearing
  # (10704/10705), Undeposited Funds (14990), and the other bank-side
  # accounts (10706 savings, 10707 sweep, 10708 Raymond James, 10709 CD).
  # A checking movement mis-booked to a sibling account can then still tie
  # (and the match says which account it hit); a sibling row that doesn't
  # tie goes internal — its own statement/clearing cycle covers it, so it
  # is never a cash exception here. SAGE_AUX_ACCOUNTS env overrides.
  aux_accounts: ["10704", "10705", "14990", "10706", "10707", "10708", "10709"]

entities:
  # Related companies whose books are NOT in Sage. Their movements through
  # this account can never auto-tie, so they're carved out as 'intercompany'
  # (own section + own dollar total) instead of flooding the critical queue.
  # Verify them against that entity's own records.
  external: ["TJW"]

cards:
  # Company credit cards autopaid from checking: bank-descriptor pattern ->
  # the card's GL liability account. Every autopay debit must be recorded
  # against its account (Dr liability / Cr cash), and purchases should be
  # accumulating there when statements are coded.
  liability_accounts:
    "WIENS TYSON": "20012"       # Credit Card Liability - Tyson Chase
    "KOFAHL NICHOLAS": "20013"   # Credit Liability - Nick Chase
    "RAMP STATEMENT": "20011"    # Ramp CC Payable — statement settlements

billcheck:
  # Vendor-name mismatches have never been a real problem here — trade
  # names vs legal names would need a mass cleanup — so the check is off.
  # (The duplicate scan still keys on vendor+invoice, unaffected.)
  check_vendor: false
  # Per-vendor payment policies for the Bill Check comparison.
  #   quickpay: take  — we take this vendor's early-pay discount; `pct` is
  #                     the negotiated rate (the invoice's offer is verified
  #                     against it, and a listed vendor's invoice with NO
  #                     discount gets a money-left-on-the-table review).
  #   quickpay: never — the discount is never taken; findings expect the
  #                     full amount at NET terms, not the discount deadline.
  #   due_anchor: ship_date — terms run from the ship date, not invoice date.
  #   notes — deal wrinkles, echoed on findings for the reviewer.
  vendor_policies:
    "TD SYNNEX":
      quickpay: never
    "ACE Backstage": {quickpay: take, pct: 5}
    "American Music": {quickpay: take, pct: 3}
    "Audio Technica": {quickpay: take, pct: 2}
    "Belden": {quickpay: take, pct: 1.5,
               notes: "QP is 1.5% of the PRE-TAX balance; the printed discount includes tax and AP corrects it by hand"}
    "MBI": {invoice_date_from: ship_date,
            notes: "the ship date is entered as the invoice date"}
    "Elite Core": {due_anchor: ship_date,
                   notes: "due date runs from the ship date"}
    "Gator": {quickpay: take, pct: 5}
    "KMC Music": {quickpay: take, pct: 1}
    "L-Acoustics": {quickpay: take, pct: 2, due_check_terms_days: [30],
                    no_qp_when_terms_days: [30],
                    notes: "terms change with the QP deal; non-Net-30 invoices carry customized prepay dates, so only Net 30 gets due-date review; Net 30 invoices usually carry no QP"}
    "Legrand": {quickpay: take, pct: 1}
    "Lenbrook": {quickpay: take, pct: 3}
    "Light Source": {quickpay: take, pct: 2, no_qp_when_terms_days: [30],
                     accept_proforma: true,
                     notes: "2% prepaid discount = the QP; proforma docs are real invoices here; Net 30 invoices never carry a QP; terms change from Net 30 to Due on Receipt with prepay — except clamps"}
    "Lowell": {quickpay: take, pct: 1}
    "McMaster Carr": {quickpay: take, pct: 2}
    "Nigel B Design": {quickpay: take, pct: 2}
    "QSC": {quickpay: take, pct: 3}
    "Sennheiser": {quickpay: take, pct: 2}
    "Shure": {quickpay: take, pct: 2}
    "Yamaha": {quickpay: take, pct: 2,
               notes: "terms change 30/90/120; no QP on warranty work"}
    "Xcel": {autopay: true, total_from: current_charges,
             notes: "autopay utility — a $0 entry is deliberate; otherwise the entered total is the CURRENT BILL amount, not the rolled-up amount due"}
    "Staging Dimensions": {invoice_number_from: order_number,
                           notes: "their S.O. number is entered as the invoice number"}
    "XPO": {invoice_date_from: ship_date,
            notes: "the shipment date is entered as the invoice date"}
    "EAN Services": {skip: true,
                     notes: "reviewed by hand in Google Sheets — the uploaded PDFs are always blurry"}
    "Pea Soup": {currency: GBP}
    "Western Disposal": {no_invoice_number: true}
  # Trade names vs legal names that are the SAME vendor.
  vendor_aliases:
    "SnapAV": "Snap One"
    "AC Lighting": "AC Americas"
    "MBI Acoustics": "MBI"

matching:
  exact_window_days: 3        # pass 1: same amount, name overlap
  batch_window_days: 45       # pass 2: GL batch posting can precede the bank
                              # debit by weeks (Bill.com posts on entry, funds later)
  fuzzy_window_days: 7        # pass 3: same amount, weak/no name signal
  split_window_days: 5        # pass 4: 2-3 same-name items summing to one debit
  timing_window_days: 5       # residuals this close to the period edge = timing
  aged_timing_days: 60        # untied and older than this = escalated exception
