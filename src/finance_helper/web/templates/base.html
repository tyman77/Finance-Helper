<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Finance Helper{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a href="{{ url_for('index') }}" class="brand">Finance Helper</a>
    <span class="topbar-right">
      <a href="{{ url_for('insights_page') }}" class="logout-link">Insights</a>
      <a href="{{ url_for('cashproof.landing') }}" class="logout-link">Cash Proof</a>
      <a href="{{ url_for('admin.admin_page') }}" class="logout-link">Admin</a>
      {% if session.get('authed') %}
        <span class="subtle">{{ session.get('email') }}</span>
        <a href="{{ url_for('logout') }}" class="logout-link">Log out</a>
      {% endif %}
    </span>
  </header>
  <main>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">
          {% for m in messages %}<p>{{ m }}</p>{% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
