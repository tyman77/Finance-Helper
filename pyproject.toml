[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-helper"
version = "0.1.0"
description = "Scout — vendor CSV -> categorized entries -> Sage Intacct / Bill.com"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "requests>=2.31", "python-dotenv>=1.0"]

[project.optional-dependencies]
web = ["Flask>=3.0", "gunicorn>=22.0", "google-auth>=2.23", "anthropic>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
